# Maestro flow — BDD-01 Booking happy path (Deofoot 1.5.0, P11).
# Pasangan 1-ke-1: features/bdd-01-booking-happy-path.feature
# appId: com.deofoot.app (applicationId rilis 1.5.0; bila build debug
# memakai suffix, sesuaikan appId sebelum jalan).
#
# PRASYARAT (lihat .feature): instalasi fresh/belum login; akun uji
# khusus sudah dibuat; lapangan Futsal pertama Rp120.000/jam; slot
# 10.00 hari ini bebas. Ganti AKUN_UJI@deofoot.test dan
# KATA_SANDI_AKUN_UJI dengan kredensial akun uji sebelum jalan.
# JANGAN memakai akun asli, akun admin, atau data pengguna asli.
#
# BATAS (diperbarui 11 Nov 2026 atas keputusan pemilik): flow berlanjut
# sampai booking TERKIRIM, memilih foto sampel dari galeri lalu menekan
# Kirim Booking. Sesudah run, keberadaan booking pending diverifikasi
# di server (cek-booking), bukan hanya dari layar.
appId: com.deofoot.app
---
- launchApp
- assertVisible: "Masuk"
- tapOn: "Masuk"
- tapOn: "Email"
- inputText: "demo@deofoot.test"
- hideKeyboard
- tapOn: "Password"
- inputText: "1234567890"
- hideKeyboard
- tapOn:
    point: "50%, 55%"
- assertVisible: "Deofoot"
- assertVisible: "Semua"
- tapOn: "Futsal"
- tapOn:
    point: "50%, 42%"
- assertVisible: "Jadwal — Lapangan 1"
- tapOn: "21.00"
- assertVisible: "1 jam · 20.00–21.00"
- tapOn: "Lanjut"
- assertVisible: "Booking Lapangan"
- assertVisible: "Ringkasan booking"
- assertVisible: "Nomor WhatsApp"
- assertVisible: "Pembayaran"
- scrollUntilVisible:
    element:
      text: "Bukti transfer"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Nomor WhatsApp aktif"
    direction: UP
- tapOn: "Nomor WhatsApp aktif"
- inputText: "081200000000"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Pilih bukti transfer dulu untuk mengaktifkan tombol."
    direction: DOWN
- tapOn: "Pilih bukti transfer"
- assertVisible: "Ambil foto"
- assertVisible: "Pilih dari galeri"
# DIPERPANJANG atas keputusan pemilik 11 Nov 2026: flow kini berlanjut
# sampai booking terkirim. Hasil yang diharapkan di server: satu booking
# pending akun demo untuk slot di atas pada hari berjalan. Langkah ekor
# dari salinan kerja bdd-01-sampai-selesai-2.yaml, koordinat foto dikoreksi
# ke 16%, 34% sesuai pemilih foto 11 Nov (satu foto, kiri atas, terverifikasi probe).
- tapOn: "Pilih dari galeri"
- waitForAnimationToEnd
- tapOn:
    point: "16%, 34%"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Kirim Booking"
    direction: DOWN
- tapOn: "Kirim Booking"
- waitForAnimationToEnd
