# Maestro flow — INT-02 Unggah bukti (Deofoot 1.5.0, P11).
# Pasangan 1-ke-1: features/int-02-unggah-bukti.feature
#
# BATAS KERAS: alur HANYA sampai layar unggah bukti tampil dan
# lembar pilih terbuka. TANPA transfer uang sungguhan, TANPA nomor/
# akun DANA asli, TANPA menekan Kirim Booking, TANPA membuka layar
# admin "Verifikasi Pembayaran". Verifikasi admin oleh isAdmin
# DI LUAR JANGKAUAN pengujian ini dan tidak diuji dengan akun asli.
appId: com.deofoot.app
---
- launchApp
- assertVisible: "Masuk"
- tapOn: "Masuk"
- tapOn: "Email"
- inputText: "AKUN_UJI@deofoot.test"
- hideKeyboard
- tapOn: "Password"
- inputText: "KATA_SANDI_AKUN_UJI"
- hideKeyboard
- tapOn:
    point: "50%, 55%"
- assertVisible: "Deofoot"
- assertVisible: "Semua"
- tapOn: "Futsal"
- tapOn: "Rp120.000/jam"
- assertVisible: "Tanggal main"
- tapOn: "10.00"
- assertVisible: "1 jam · 10.00–11.00"
- tapOn: "Lanjut"
- assertVisible: "Booking Lapangan"
- assertVisible: "Bukti transfer"
- assertVisible: "Belum ada bukti transfer"
- assertVisible: "Pilih bukti transfer"
- tapOn: "Nomor WhatsApp aktif"
- inputText: "081200000000"
- hideKeyboard
- assertVisible: "Pilih bukti transfer dulu untuk mengaktifkan tombol."
- tapOn: "Pilih bukti transfer"
- assertVisible: "Ambil foto"
- assertVisible: "Pilih dari galeri"
# AKHIR FLOW — tanpa transfer, tanpa kirim, tanpa verifikasi admin.
