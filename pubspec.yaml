name: deofoot
description: "Aplikasi booking lapangan Deofoot."
publish_to: 'none'
version: 1.4.1+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  image_picker: ^1.2.4
  google_sign_in: ^6.3.0
  flutter_local_notifications: ^22.3.2
  pdf: ^3.13.1
  printing: ^5.15.1
  timezone: ^0.11.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/deofoot-logo.png
    - assets/images/fields/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/deofoot-logo.png"
  adaptive_icon_background: "#102A43"
  adaptive_icon_foreground: "assets/deofoot-logo.png"
