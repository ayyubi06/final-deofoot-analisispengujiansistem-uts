name: SonarQube Cloud

on:
  push:
    branches: [fitur/sonarqube-p13]
  pull_request:
    branches: [fitur/sonarqube-p13]

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Flutter dikunci ke versi lokal 3.47.9 (Dart 3.13.7): analyze 0 isu,
      # test 170/170 lulus. Channel stable di CI lebih baru dan menggagalkan
      # run (29 info depresiasi material.dart, 9 test animasi gagal).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get
      # --no-fatal-infos: info tidak boleh menggagalkan gerbang;
      # error dan warning tetap fatal.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
