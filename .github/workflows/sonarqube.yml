name: SonarQube Cloud

on:
  push:
    branches: [fitur/sonarqube-p13]
  pull_request:
    branches: [fitur/sonarqube-p13]

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # --no-fatal-infos: Flutter stable di CI lebih baru dari Flutter lokal,
      # sehingga analyze melaporkan 29 info deprecated_member_use (material.dart
      # usang sesudah v3.47.0-0.0.pre). Info tidak boleh menggagalkan gerbang;
      # error dan warning tetap fatal.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
